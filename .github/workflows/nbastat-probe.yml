name: NBA Stat - prueba manual 1369 (sin publicar estadísticas)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe INSPECT_1369 para autorizar una única consulta del esquema'
        required: true
        type: string
      no_external_clients:
        description: 'Confirmo que no hay otros clientes externos activos usando la misma cuenta'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: nbastat-account-quota
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'INSPECT_1369' && inputs.no_external_clients
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspeccionar solo estructura, sin guardar respuesta ni publicar datos
        env:
          NBASTAT_API_TOKEN: ${{ secrets.NBASTAT_API_TOKEN }}
          CONFIRM_NBASTAT: ${{ inputs.confirmation }}
          CONFIRM_NO_EXTERNAL_CLIENTS: ${{ inputs.no_external_clients }}
        run: node scripts/probe-nbastat.mjs
